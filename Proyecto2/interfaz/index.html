<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de intrusiones</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Detector de intrusiones SSH</h1>
        <p class="intro">
            Analiza el log de autenticación de <code>srv-web01</code> y señala las IPs sospechosas.
            Esta herramienta solo informa: nunca bloquea una IP.
        </p>

        <form id="form-analisis" novalidate>
            <div>
                <label for="fichero">Cargar un fichero de log (opcional):</label>
                <input type="file" id="fichero" accept=".log,.txt,text/plain">
            </div>

            <div>
                <label for="log">Líneas de log:</label>
                <textarea id="log" rows="8" placeholder="Pega aquí el log o carga un fichero"></textarea>
            </div>

            <div>
                <label for="umbral">Umbral (0 a 1):</label>
                <input type="number" id="umbral" min="0" max="1" step="0.05" value="0.7">
            </div>

            <div>
                <label for="lista-blanca">Lista blanca (IPs separadas por comas):</label>
                <input type="text" id="lista-blanca" placeholder="ej: 192.168.1.20, 203.0.113.45">
            </div>

            <button type="submit" id="boton-analizar">Analizar log</button>
        </form>

        <div id="errores" role="alert" hidden></div>
        <div id="resultados" aria-live="polite" hidden></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
